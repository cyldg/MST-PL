EXP:
  ADVICE_METHOD: "ClipMLP"
  WANDB_SILENT: False
  PROJ: "OfficeHome_LADS_Replication"
  SEED: 0
  TEXT_PROMPTS: [["clipart of a {}."],['a product image of a {} with clean background.'],['a realistic photo of a {}.']]
  NEUTRAL_TEXT_PROMPTS: ["an artistic painting of a {}."]
  AUGMENTATION: LADS
  N_CTX_GLOBAL: 8
  N_CTX_DOMAIN: 8
  N_ROUNDS: 20
  G_EPOCHS: 5
  D_EPOCHS: 5
  LR: 0.005
  LR2: 0.01
  LOGOUT: 'FASTPT_OfficeHome_a'
  
  
DATA:
  DATASET: "OfficeHome"
  LOAD_CACHED: True
  BATCH_SIZE: 256
  SAVE_PATH: 'OfficeHome_embeddings'
  TARGET: 'Art'

METHOD:
  MODEL:
    NUM_LAYERS: 1
    DOM_WEIGHT: 1.0
    LR: 0.0001
    CHECKPOINT: 'checkpoint/mlp_simple.pth'
    CHECKPOINT_NAME: 'OfficeHome-mlp-directional'
    RESUME: False
  USE_DOM_GT: True

AUGMENTATION:
  MODEL:
    LR: 0.0001
    WEIGHT_DECAY: 0.005
    NUM_LAYERS: 1
  EPOCHS: 50
  GENERIC: False
  ALPHA: 0.5
  # DOM_LABELS: ['Art', 'Clipart', 'Product', 'RealWorld']
  #prompts: [["an artistic painting of a {}."], ["clipart of a {}."],['a product image of a {} with clean background.'],['a realistic photo of a {}.']]
  DOM_LABELS: [ 'Clipart', 'Product', 'RealWorld']
  INCLUDE_ORIG_TRAINING: False