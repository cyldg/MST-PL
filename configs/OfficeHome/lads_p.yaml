EXP:
  ADVICE_METHOD: "ClipMLP"
  WANDB_SILENT: False
  PROJ: "OfficeHome_LADS_Replication"
  SEED: 0
  TEXT_PROMPTS: [["an artistic painting of a {}."], ["clipart of a {}."],['a realistic photo of a {}.']]
  NEUTRAL_TEXT_PROMPTS: ['a product image of a {} with clean background.']
  AUGMENTATION: LADS
  EPOCHS: 400
  ENSAMBLE: False
  LOG_NN: True
  
  
DATA:
  DATASET: "OfficeHome"
  LOAD_CACHED: True
  BATCH_SIZE: 256
  SAVE_PATH: 'OfficeHome_embeddings'
  SOURCE: 'Product'

METHOD:
  MODEL:
    NUM_LAYERS: 1
    DOM_WEIGHT: 1.0
    LR: 0.0001
    CHECKPOINT: 'checkpoint/mlp_simple.pth'
    CHECKPOINT_NAME: 'OfficeHome-mlp-directional'
    RESUME: False
  USE_DOM_GT: True

AUGMENTATION:
  MODEL:
    LR: 0.0001
    WEIGHT_DECAY: 0.005
    NUM_LAYERS: 1
  EPOCHS: 50
  GENERIC: False
  ALPHA: 0.5
  # DOM_LABELS: ['Art', 'Clipart', 'Product', 'RealWorld']
  #prompts: [["an artistic painting of a {}."], ["clipart of a {}."],['a product image of a {} with clean background.'],['a realistic photo of a {}.']]
  DOM_LABELS: ['Art', 'Clipart', 'RealWorld']
  INCLUDE_ORIG_TRAINING: False