EXP:
  ADVICE_METHOD: "ClipMLP"
  WANDB_SILENT: False
  PROJ: "DomainNetMini_LADS_Replication"
  SEED: 0
  TEXT_PROMPTS: [['clipart of a {}.'], ['an infographic showing a {}'], ['a painting of a {}'],['a realistic photo of a {}'],['a pencil drawing of a {}.']]
  NEUTRAL_TEXT_PROMPTS: ['a quickdraw of a {}']
  # TEXT_PROMPTS: [ 'a realistic photo of a {}.', 'a painting of a {}.', 'clipart of a {}.']
  # NEUTRAL_TEXT_PROMPTS: ['a sketch of a {}', 'a pencil drawing of a {}.', 'a drawing of a {}.'] # you can also just use one prompt
  # AUGMENTATION: 'LADS'
  AUGMENTATION: LADS
  EPOCHS: 400
  ENSAMBLE: False
  LOG_NN: True
  
  
DATA:
  DATASET: "DomainNet"
  LOAD_CACHED: True
  BATCH_SIZE: 256
  SAVE_PATH: 'DomainNet_embeddings'
  SOURCE: 'quickdraw'

METHOD:
  MODEL:
    NUM_LAYERS: 1
    DOM_WEIGHT: 1.0
    LR: 0.0001
    CHECKPOINT: 'checkpoint/mlp_simple.pth'
    CHECKPOINT_NAME: 'DomainNet-mlp-directional'
    RESUME: False
  USE_DOM_GT: True

AUGMENTATION:
  MODEL:
    LR: 0.0001
    WEIGHT_DECAY: 0.005
    NUM_LAYERS: 1
  EPOCHS: 50
  GENERIC: False
  ALPHA: 0.5
  # DOM_LABELS: ['clipart', 'infograph', 'painting', 'quickdraw', 'real', 'sketch']
  #prompts: [['clipart of a {}.'], ['an infographic showing a {}'], ['a painting of a {}'],['a quickdraw of a {}'],['a realistic photo of a {}'],['a pencil drawing of a {}.']]
  DOM_LABELS: ['clipart', 'infograph', 'painting', 'real', 'sketch']
  INCLUDE_ORIG_TRAINING: False